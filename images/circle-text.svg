<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Circular text emblem</title>
  <desc id="desc">Text arranged around a circle using a textPath.</desc>

  <defs>
    <path
      id="circlePath"
      d="M 50,50 m -33,0
         a 33,33 0 1,1 66,0
         a 33,33 0 1,1 -66,0" />
  </defs>

  <circle cx="50" cy="50" r="33" fill="none" stroke="none" />

  <text
    fill="currentColor"
    font-family="Georgia, serif"
    font-size="8"
    letter-spacing="1.8"
    text-anchor="middle">
    <textPath href="#circlePath" startOffset="50%">QUICK BROWN FOX JUMPS OVER THE LAZY DOG</textPath>
  </text>
</svg>
